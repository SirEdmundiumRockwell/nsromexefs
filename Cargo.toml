[workspace]
resolver = "2"
members = [
    "crates/nsromexefs-core",
    "crates/nsromexefs-cli",
    "crates/nsromexefs-gui/src-tauri",
]
# El crate de fuzzing es independiente: necesita nightly y libFuzzer.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Sir Edmund Rockwell"]
repository = "https://github.com/SirEdmundiumRockwell/nsromexefs"

[workspace.dependencies]
nsromexefs-core = { path = "crates/nsromexefs-core", version = "0.1.1" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
