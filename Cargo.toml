[workspace]
resolver = "2"
members = [
    "crates/nsromexefs-core",
    "crates/nsromexefs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Sir Edmund Rockwell"]
repository = "https://github.com/SirEdmundiumRockwell/nsromexefs"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
