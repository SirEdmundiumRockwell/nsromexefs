[package]
name = "nsromexefs-cli"
description = "nsromexefs CLI: extract NSP/XCI containers to exefs and romfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["nintendo-switch", "nsp", "xci", "romfs", "exefs"]
categories = ["command-line-utilities"]

[[bin]]
name = "nsromexefs"
path = "src/main.rs"

[dependencies]
nsromexefs-core.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
