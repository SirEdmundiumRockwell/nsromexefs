name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Match tag to workspace version
        shell: bash
        run: |
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$VERSION"
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: nsromexefs-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: nsromexefs-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: nsromexefs-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: nsromexefs-x86_64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release --package nsromexefs-cli --target ${{ matrix.target }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'nsromexefs-dist'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nsromexefs.exe" $stage
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md $stage
          Copy-Item docs/claves.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.archive }}"
      - name: Package Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nsromexefs-dist"
          cp "target/${{ matrix.target }}/release/nsromexefs" "$RUNNER_TEMP/nsromexefs-dist/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md "$RUNNER_TEMP/nsromexefs-dist/"
          cp docs/claves.md "$RUNNER_TEMP/nsromexefs-dist/"
          tar -czf "${{ matrix.archive }}" -C "$RUNNER_TEMP/nsromexefs-dist" .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          archives = sorted(path for path in dist.iterdir() if path.is_file())
          if not archives:
              raise SystemExit("No release archives were downloaded")
          lines = []
          for path in archives:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nsromexefs ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
