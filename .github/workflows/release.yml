name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check version consistency
        run: node scripts/version.mjs --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GUI dependencies
        run: npm ci --prefix crates/nsromexefs-gui
      - name: Build GUI frontend
        run: npm --prefix crates/nsromexefs-gui run build
      - name: Prepare bundled CLI sidecar
        run: node crates/nsromexefs-gui/scripts/prepare-sidecar.mjs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: nsromexefs-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: nsromexefs-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: nsromexefs-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: nsromexefs-x86_64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release --package nsromexefs-cli --target ${{ matrix.target }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'nsromexefs-dist'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nsromexefs.exe" $stage
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md, CONTRIBUTING.md, SECURITY.md $stage
          Copy-Item docs -Destination $stage -Recurse
          New-Item -ItemType Directory -Force (Join-Path $stage 'crates/nsromexefs-gui') | Out-Null
          Copy-Item 'crates/nsromexefs-gui/README.md' (Join-Path $stage 'crates/nsromexefs-gui/README.md')
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.archive }}"
      - name: Package Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nsromexefs-dist"
          cp "target/${{ matrix.target }}/release/nsromexefs" "$RUNNER_TEMP/nsromexefs-dist/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md CONTRIBUTING.md SECURITY.md "$RUNNER_TEMP/nsromexefs-dist/"
          cp -r docs "$RUNNER_TEMP/nsromexefs-dist/"
          mkdir -p "$RUNNER_TEMP/nsromexefs-dist/crates/nsromexefs-gui"
          cp crates/nsromexefs-gui/README.md "$RUNNER_TEMP/nsromexefs-dist/crates/nsromexefs-gui/"
          tar -czf "${{ matrix.archive }}" -C "$RUNNER_TEMP/nsromexefs-dist" .
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  build-windows-gui:
    name: Build Windows GUI installers
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nsromexefs-gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-gui
      - name: Install GUI dependencies
        run: npm ci --prefix crates/nsromexefs-gui
      - name: Build GUI installers
        working-directory: crates/nsromexefs-gui
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-gui
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    needs: [validate, build, build-windows-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Flatten downloaded artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv {} release-assets/ \;
      - name: Verify expected assets
        shell: bash
        run: |
          msi="$(find release-assets -maxdepth 1 -name '*.msi' | wc -l)"
          exe="$(find release-assets -maxdepth 1 -name '*-setup.exe' | wc -l)"
          test "$msi" -eq 1
          test "$exe" -eq 1
          test "$(find release-assets -maxdepth 1 -name 'nsromexefs-*' | wc -l)" -ge 4
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          assets = Path("release-assets")
          archives = sorted(path for path in assets.iterdir() if path.is_file())
          if not archives:
              raise SystemExit("No release assets were downloaded")
          lines = []
          for path in archives:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (assets / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: nsromexefs ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
