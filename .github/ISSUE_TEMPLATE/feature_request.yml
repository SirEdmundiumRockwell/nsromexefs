name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind. Requests for keys, ROMs, or copyrighted content will be closed.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - Core extraction engine
        - Desktop GUI
        - Build or packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: This request does not involve distributing keys, ROMs, or copyrighted content.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
