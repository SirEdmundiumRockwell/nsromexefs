name: Bug report
description: Report a reproducible problem with nsromexefs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include keys, ROMs, firmware, or personal paths. Redact logs before pasting them.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - Core extraction engine
        - Desktop GUI
        - Build or packaging
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nsromexefs --version`, the installer version, or the commit hash.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, macOS 15, ...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Use redacted logs. Do not include keys, ROMs, or personal paths.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I removed keys, ROMs, firmware, and personal paths from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
